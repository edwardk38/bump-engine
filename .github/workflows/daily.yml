name: Daily slate build

on:
  schedule:
    # 11:00 UTC ~= 7:00 AM ET. Probable starters are usually posted by early
    # morning. GitHub cron is UTC and can run a few minutes late.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for on-demand testing

permissions:
  contents: write         # lets the job commit the regenerated JSON back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's slate JSON
        run: python -m engine.build

      - name: Log yesterday's actual strikeouts
        run: python -m engine.log_actuals

      - name: Commit updated JSON + log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public data
          git diff --staged --quiet || (git commit -m "Slate $(date -u +%F)" && git push)
